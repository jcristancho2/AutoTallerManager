version: '3.9'

services:
  db:
    image: postgres:16
    container_name: autotaller_db
    environment:
      POSTGRES_DB: autotallerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # localhost:5433 -> container:5432
    volumes:
      - autotaller_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autotallerdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..                    
      dockerfile: AutoTallerManager.API/Api.Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080" 
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=autotallerdb;Username=postgres;Password=postgres"
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  autotaller_data:
